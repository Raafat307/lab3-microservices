name: Classroom CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec rsoi-postgres pg_isready -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done

      - name: Run unit tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: program
          DB_PASSWORD: test
        run: mvn test

      - name: Start all services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          for port in 8050 8060 8070 8080; do
            echo "Waiting for port $port..."
            for i in {1..60}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/manage/health | grep -q "200"; then
                echo "Port $port is active"
                break
              fi
              sleep 2
            done
          done


      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman (Postman Integration Tests)
        run: |
          newman run postman/collection.json -e postman/environment.json --reporters cli

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down